<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zoro mascot: a friendly amber fox merchant in an emerald shopkeeper's apron holding up a gold shopping bag with a Z monogram">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3157"/>
      <stop offset="1" stop-color="#171B30"/>
    </linearGradient>
    <linearGradient id="apronGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22BA88"/>
      <stop offset="1" stop-color="#149067"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#4A5182" stroke-width="3"/>

  <!-- subtle upward sales-trend spark (top-left) -->
  <g opacity="0.5">
    <path d="M 76 172 L 104 144 L 122 158 L 148 126" fill="none" stroke="#22BA88" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 162 110 L 154 131 L 142 121 Z" fill="#22BA88"/>
  </g>

  <!-- gold sparkles -->
  <g fill="#F5B841" opacity="0.8">
    <path d="M 448 78 Q 451 86 459 89 Q 451 92 448 100 Q 445 92 437 89 Q 445 86 448 78 Z"/>
    <path d="M 86 240 Q 88 246 94 248 Q 88 250 86 256 Q 84 250 78 248 Q 84 246 86 240 Z"/>
    <path d="M 448 330 Q 450 336 456 338 Q 450 340 448 346 Q 446 340 440 338 Q 446 336 448 330 Z"/>
  </g>

  <g stroke="#20243E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

    <!-- tail (left) -->
    <path d="M 202 384 Q 124 376 112 314 Q 107 286 136 282 Q 124 314 150 336 Q 172 352 204 356 Z" fill="#F2A93B"/>
    <path d="M 136 282 Q 107 286 112 314 Q 120 295 136 282 Z" fill="#F7EFDD"/>

    <!-- feet -->
    <ellipse cx="224" cy="408" rx="20" ry="12" fill="#F2A93B"/>
    <ellipse cx="278" cy="408" rx="20" ry="12" fill="#F2A93B"/>

    <!-- torso -->
    <path d="M 204 292 Q 250 304 296 292 L 314 396 Q 250 414 186 396 Z" fill="#F2A93B"/>

    <!-- collar -->
    <path d="M 216 284 Q 250 296 284 284 L 290 302 Q 250 312 210 302 Z" fill="#2C3155"/>

    <!-- apron neck straps -->
    <path d="M 230 302 L 238 284" fill="none" stroke="#149067" stroke-width="7"/>
    <path d="M 270 302 L 262 284" fill="none" stroke="#149067" stroke-width="7"/>

    <!-- apron -->
    <path d="M 218 302 L 282 302 L 300 394 Q 250 408 200 394 Z" fill="url(#apronGrad)"/>
    <!-- apron waist band -->
    <path d="M 210 340 Q 250 348 290 340 L 292 352 Q 250 360 208 352 Z" fill="#0E7A58" stroke-width="3"/>
    <!-- apron pocket -->
    <path d="M 232 358 L 272 360 L 269 388 Q 250 393 234 386 Z" fill="#0E7A58" stroke-width="3"/>
    <path d="M 236 364 Q 251 368 268 365" fill="none" stroke="#F7EFDD" stroke-width="2.5" opacity="0.7"/>

    <!-- left arm holding small price tag -->
    <path d="M 208 306 Q 184 322 186 350" fill="none" stroke-width="26"/>
    <path d="M 208 306 Q 184 322 186 350" fill="none" stroke="#F2A93B" stroke-width="18"/>
    <path d="M 187 356 L 180 380" fill="none" stroke-width="3"/>
    <g transform="translate(162 378) rotate(-14)">
      <path d="M 0 12 L 12 2 H 42 Q 47 2 47 7 V 21 Q 47 26 42 26 H 12 Z" fill="#F5B841" stroke-width="3"/>
      <circle cx="10" cy="14" r="3" fill="#2C3155" stroke="none"/>
    </g>
    <circle cx="188" cy="352" r="12" fill="#F2A93B"/>

    <!-- right arm raised (passes behind the bag) -->
    <path d="M 296 300 Q 344 252 384 138" fill="none" stroke-width="26"/>
    <path d="M 296 300 Q 344 252 384 138" fill="none" stroke="#F2A93B" stroke-width="18"/>

    <!-- gold shopping bag with Z monogram (held up, right) -->
    <path d="M 366 166 Q 366 126 390 126 Q 414 126 414 166" fill="none" stroke-width="13"/>
    <path d="M 366 166 Q 366 126 390 126 Q 414 126 414 166" fill="none" stroke="#C9862A" stroke-width="7"/>
    <rect x="340" y="160" width="100" height="112" rx="12" fill="#F5B841"/>
    <path d="M 368 190 H 412 V 202 L 388 230 H 412 V 242 H 368 V 230 L 392 202 H 368 Z" fill="#2C3155" stroke="none"/>
    <circle cx="389" cy="130" r="12" fill="#F2A93B"/>

    <!-- ears -->
    <path d="M 190 152 L 172 72 L 244 116 Q 212 126 190 152 Z" fill="#F2A93B"/>
    <path d="M 194 138 L 184 92 L 230 118 Z" fill="#2C3155" stroke="none"/>
    <path d="M 310 152 L 328 72 L 256 116 Q 288 126 310 152 Z" fill="#F2A93B"/>
    <path d="M 306 138 L 316 92 L 270 118 Z" fill="#2C3155" stroke="none"/>

    <!-- head -->
    <path d="M 180 150 Q 250 118 320 150 Q 340 184 334 218 Q 322 262 286 276 Q 250 286 214 276 Q 178 262 166 218 Q 160 184 180 150 Z" fill="#F2A93B"/>

    <!-- muzzle -->
    <path d="M 212 232 Q 250 220 288 232 Q 292 264 250 274 Q 208 264 212 232 Z" fill="#F7EFDD"/>
    <path d="M 241 231 Q 250 225 259 231 Q 257 242 250 245 Q 243 242 241 231 Z" fill="#20243E" stroke="none"/>
    <path d="M 238 258 Q 250 266 262 258" fill="none"/>

    <!-- eyes -->
    <circle cx="218" cy="196" r="7.5" fill="#20243E" stroke="none"/>
    <circle cx="282" cy="196" r="7.5" fill="#20243E" stroke="none"/>
    <circle cx="220.5" cy="193.5" r="2.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="284.5" cy="193.5" r="2.5" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
